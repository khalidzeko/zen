<!DOCTYPE html>
<html>
<head>
  <title>Users List</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      padding: 8px 12px;
      border: 1px solid #ccc;
    }
    th {
      background-color: #f4f4f4;
    }
    form {
      display: inline;
    }
    .delete-button {
      color: red;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      font-size: 1em;
      padding: 0;
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <h2>All Users</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Room</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.full_name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.room }}</td>
        <td>
          <a href="{{ url_for('edit_user', user_id=user.id) }}">Edit</a>
          {% if current_user.id != user.id %}
            |
            <form method="POST" action="{{ url_for('delete_user', user_id=user.id) }}" 
                  onsubmit="return confirm('Are you sure you want to delete user {{ user.username }}?');">
              <button type="submit" class="delete-button">Delete</button>
            </form>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <p><a href="{{ url_for('dashboard') }}">← Back to Dashboard</a></p>
</body>
</html>
