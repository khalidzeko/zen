services:
  - type: web
    name: zentra
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    disk:
      name: zentra-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URI
        value: sqlite:////var/data/ticketapp.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: FLASK_DEBUG
        value: "0"
