databases:
  - name: zentra-db
    plan: free
    databaseName: zentra
    user: zentra

services:
  - type: web
    name: zentra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URI
        fromDatabase:
          name: zentra-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "0"
